name: tests

on:
  push:
  pull_request:

jobs:
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Install the accessibility checker
        run: npm install --prefix /tmp/axe axe-core@4

      - name: Run every test
        run: python run_all_tests.py

      - name: String tester - accuracy on synthetic takes (known notes)
        run: node tests/tester/evaluate.js --quick

      - name: String tester - real browser with a fake microphone
        run: |
          npm install --prefix /tmp/pwcore playwright-core@1.56
          PLAYWRIGHT_CORE=/tmp/pwcore/node_modules/playwright-core node tests/tester/browser.test.js
